[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Headless-only code has no business in the browser build: the CLI entry points,
; the test suite and the sim plans are megabytes of GDScript the page never runs.
export_files=PackedStringArray()
exclude_filter="cli/*, tests/*, scenes/boot/*"
include_filter=""
export_path="../build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=0

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; Single-threaded on purpose. The threaded Web build needs SharedArrayBuffer,
; which needs COOP/COEP response headers, which GitHub Pages cannot send. The
; game is turn-based and waits on a click, so it has nothing to gain from
; threads and everything to lose from not loading at all.
variant/thread_support=false
variant/extensions_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false

; L'app da scaricare per il computer (D-141). Serve perche' la stanza della
; voce 27 ha bisogno di un processo che apra porte in ascolto, e una pagina in
; un browser non puo' farlo: chi ospita il tavolo ha bisogno di un'app vera.
;
; `include_filter="web/*"` non e' un dettaglio: console.html e tavolo.html non
; sono risorse che Godot importa, quindi `all_resources` non le vede e
; l'app si costruirebbe benissimo per poi servire una pagina vuota ai telefoni.
