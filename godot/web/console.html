<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ECHOES — La tua console</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #17140f; color: #c9bfae;
    font: 15px/1.45 Georgia, 'Times New Roman', serif;
    padding: 12px 12px 90px;
  }
  h1 { font-size: 22px; color: #e8dcc3; margin-bottom: 2px; }
  h2 {
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: #8a8172; margin: 16px 0 6px; border-bottom: 1px solid #2c2820;
    padding-bottom: 3px;
  }
  #stato { font-size: 12px; color: #8a8172; }
  #stato.giu { color: #c8553d; }
  .riga { padding: 2px 0; }
  .mia { color: #e8b563; }
  .fatto { color: #6fa88a; }
  .manca { color: #5f584c; }
  .carta {
    display: inline-block; background: #221e16; border: 1px solid #3a3427;
    border-radius: 6px; padding: 4px 9px; margin: 3px 4px 3px 0; font-size: 13px;
  }
  .famiglia { color: #8a8172; font-size: 11px; }
  #avvisi .riga { color: #e8b563; }
  #domanda {
    position: fixed; left: 0; right: 0; bottom: 0;
    border-top: 2px solid #e8b563;
    padding: 12px; max-height: 62vh; overflow-y: auto; display: none;
    /* Lo scorrimento resta dentro il riquadro: senza, il dito che arriva in
       fondo alle scelte continua a scorrere la pagina sotto e sembra che le
       opzioni siano finite (D-143). */
    overscroll-behavior: contain;
    /* Le due ombre che dicono «c'e' altro»: `local` scorre col contenuto e
       copre l'ombra quando sei al bordo, `scroll` resta ferma. Compaiono e
       spariscono da sole, senza una riga di JavaScript. */
    background-color: #221e16;
    background-image:
      linear-gradient(#221e16 30%, rgba(34, 30, 22, 0)),
      linear-gradient(rgba(34, 30, 22, 0), #221e16 70%),
      radial-gradient(farthest-side at 50% 0, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0)),
      radial-gradient(farthest-side at 50% 100%, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
    background-position: top, bottom, top, bottom;
    background-size: 100% 26px, 100% 26px, 100% 11px, 100% 11px;
    background-repeat: no-repeat;
    background-attachment: local, local, scroll, scroll;
  }
  #domanda .quante {
    color: #8a8172; font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; margin: -2px 0 8px;
  }
  #domanda.aperta { display: block; }
  #domanda p { color: #e8dcc3; margin-bottom: 8px; }
  #domanda button {
    display: block; width: 100%; text-align: left;
    background: #2c2820; color: #c9bfae; border: 1px solid #3a3427;
    border-radius: 6px; padding: 10px 12px; margin: 6px 0;
    font: 14px Georgia, serif; cursor: pointer;
  }
  #domanda button:active { background: #3a3427; }
  #domanda button.decidi { color: #8a8172; font-style: italic; }
  .coperta { color: #8a8172; font-style: italic; }
  /* La mano: le carte in fila, alte quanto basta per leggere il titolo e
     riconoscere la famiglia dal colore. Il resto lo fa la lente. */
  .mano { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0; }
  .faccia {
    width: 104px; height: auto; border-radius: 5px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
  }
  .faccia:active { transform: scale(0.97); }
  #lente {
    position: fixed; inset: 0; background: rgba(8, 7, 6, 0.94);
    display: none; align-items: center; justify-content: center; padding: 18px;
    z-index: 10;
  }
  #lente.aperta { display: flex; }
  #lente img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>
<h1 id="nome">ECHOES</h1>
<div id="stato">mi collego…</div>
<div id="avvisi"></div>
<div id="scheda"></div>
<div id="lente"></div>
<div id="domanda"></div>
<script>
"use strict";
const WS_PORT = "__WS_PORT__";
const params = new URLSearchParams(location.search);
let token = params.get("t") || localStorage.getItem("echoes_token") || "";
if (params.get("t")) localStorage.setItem("echoes_token", params.get("t"));

const stato = document.getElementById("stato");
const scheda = document.getElementById("scheda");
const avvisi = document.getElementById("avvisi");
const domanda = document.getElementById("domanda");
const lente = document.getElementById("lente");
let ws = null, pinger = null;
const dette = [];

function collega() {
  ws = new WebSocket("ws://" + location.hostname + ":" + WS_PORT);
  ws.onopen = () => {
    stato.textContent = "al tavolo";
    stato.classList.remove("giu");
    ws.send(JSON.stringify({kind: "hello", token: token}));
    clearInterval(pinger);
    pinger = setInterval(() => {
      if (ws.readyState === 1) ws.send(JSON.stringify({kind: "ping"}));
    }, 8000);
  };
  ws.onmessage = (event) => ricevi(JSON.parse(event.data));
  ws.onclose = () => {
    stato.textContent = "filo caduto — riprovo…";
    stato.classList.add("giu");
    setTimeout(collega, 2000);
  };
}

function ricevi(msg) {
  if (msg.kind === "state") disegna(msg.model);
  else if (msg.kind === "say") avvisa(msg.text);
  else if (msg.kind === "choose") chiedi(msg);
}

function riga(testo, classe) {
  return '<div class="riga ' + (classe || "") + '">' + testo + "</div>";
}
function scappa(testo) {
  return String(testo).replace(/&/g, "&amp;").replace(/</g, "&lt;");
}

function disegna(m) {
  document.getElementById("nome").textContent = m.name;
  let h = "";
  h += "<h2>Anno " + m.year + " — atto " + m.act + ", round " + m.round + "</h2>";
  h += "<h2>Le domande</h2>";
  for (const t of m.tensions) {
    h += riga(t.value < 0
      ? scappa(t.title) + ' — <span class="coperta">coperta</span>'
      : scappa(t.title) + " — " + t.value + " su " + t.threshold);
  }
  if (m.destiny && m.destiny.title) {
    h += "<h2>Il tuo Destino — " + scappa(m.destiny.title) + "</h2>";
    for (const r of m.destiny.rungs)
      h += riga((r.holds ? "[x] " : "[ ] ") + scappa(r.label), r.holds ? "fatto" : "manca");
  }
  h += "<h2>La tua mano</h2>";
  if (!m.hand.length && !m.echo_hand.length) h += riga("vuota", "manca");
  // La carta stampata, non un'etichetta che le somiglia (D-101, D-144): la
  // faccia arriva dall'host, disegnata dalla stessa funzione che impagina i
  // fogli da fustellare. Un tocco la ingrandisce, perche' a mano piena una
  // carta larga un pollice non si legge.
  h += '<div class="mano">';
  for (const c of m.hand)
    h += carta("asset", c.id, c.title + " — " + c.family.toLowerCase());
  for (const c of m.echo_hand)
    h += carta("echo", c.id, c.title + " — narratore");
  h += "</div>";
  if (m.signs.length) {
    h += "<h2>I segni della casa</h2>";
    for (const s of m.signs) h += riga(scappa(s));
  }
  h += "<h2>I rapporti</h2>";
  for (const r of m.relations) h += riga(scappa(r.name) + " — " + scappa(r.level).toLowerCase());
  if (m.rights.length) {
    h += "<h2>I diritti</h2>";
    for (const d of m.rights)
      h += riga(scappa(d.holder) + " — " + scappa(d.domain), d.mine ? "mia" : "");
  }
  scheda.innerHTML = h;
}

function avvisa(testo) {
  if (!testo.trim()) return;
  dette.push(testo);
  while (dette.length > 6) dette.shift();
  avvisi.innerHTML = dette.map(t => riga(scappa(t))).join("");
}

function carta(mazzo, id, titolo) {
  return '<img class="faccia" loading="lazy" alt="' + scappa(titolo) +
         '" title="' + scappa(titolo) +
         '" src="/carta/' + encodeURIComponent(mazzo) + "/" + encodeURIComponent(id) + '.svg">';
}

// La lente: la carta toccata a tutto schermo, e un secondo tocco la chiude.
document.addEventListener("click", e => {
  const faccia = e.target.closest(".faccia");
  if (faccia) {
    lente.innerHTML = '<img src="' + faccia.getAttribute("src") + '" alt="' + faccia.alt + '">';
    lente.classList.add("aperta");
    return;
  }
  if (e.target.closest("#lente")) lente.classList.remove("aperta");
});

function chiedi(msg) {
  let h = "<p>" + scappa(msg.prompt) + "</p>";
  // Con una decina di scelte le ultime stanno sotto il bordo, e su un telefono
  // nessuno immagina che quel riquadro scorra dentro una pagina che gia'
  // scorre. Il conto lo dice a parole (D-143); le ombre lo dicono a colori.
  if (msg.labels.length > 4) {
    h += '<p class="quante">' + msg.labels.length + " scelte — scorri per vederle tutte</p>";
  }
  msg.labels.forEach((label, i) => {
    h += '<button data-i="' + i + '">' + scappa(label) + "</button>";
  });
  h += '<button class="decidi" data-i="-1">Decidi tu (la policy gioca per me)</button>';
  domanda.innerHTML = h;
  domanda.classList.add("aperta");
  domanda.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      ws.send(JSON.stringify({kind: "chosen", ask_id: msg.ask_id, index: +b.dataset.i}));
      domanda.classList.remove("aperta");
    };
  });
  if (navigator.vibrate) navigator.vibrate(80);
}

collega();
</script>
</body>
</html>
