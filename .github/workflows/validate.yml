name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"

jobs:
  data:
    name: Dati e schemi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install 'jsonschema>=4.18' 'referencing>=0.30'

      # The single source of truth is /schema (spec v0.2 §17).
      - name: Validate godot/data against /schema
        run: python3 tools/validate_data.py

      # Una guardia che nessuno ha mai visto mordere non e' una guardia: il
      # conto dei gettoni gira su un difetto piantato apposta prima di girare
      # sui dati veri (D-177).
      - name: La guardia dei gettoni morde
        run: python3 tools/validate_data.py --self-test

      # schema_defs.gd is generated. If it no longer matches the schemas, the
      # Godot-side validation and the Python-side validation have diverged.
      - name: Drift check - generated GDScript schema
        run: python3 tools/gen_gd_schema.py --check

      - name: Drift check - asset manifest
        run: python3 tools/build_manifest.py --check

      # La grammatica fisica (D-256). Il gioco deve poter essere giocato al
      # tavolo senza app, e al tavolo un gettone che nessuna carta, Domanda o
      # Destino guarda e' peggio che nel codice: un giocatore lo posa e aspetta
      # che serva a qualcosa. Questo passo va rosso se un segno resta muto, se
      # una Domanda si aprirebbe sempre, se una carta ha un'Azione senza
      # Risonanza, o se un Tema ha un mazzo che non si puo' aprire.
      - name: La grammatica fisica tiene
        run: python3 tools/validate_physical.py --check

      # PZ-0: i segni sono una collezione dichiarata (godot/data/tags), e la
      # guardia che la tiene allineata ai dati deve farsi vedere mordere su
      # difetti piantati apposta — una guardia mai vista rossa non e' una
      # guardia (lezione di D-256, due volte).
      - name: La guardia del dizionario dei segni morde
        run: python3 tools/validate_physical.py --self-test

      # Il registro dei segni (D-225). Un segno che le Conseguenze o le carte
      # scrivono sul mondo e che **nessuno legge** non e' una regola: e' colore
      # travestito da regola, e non lo si vede giocando — la partita gira lo
      # stesso. Questo passo va rosso se ne compare uno non dichiarato, se uno
      # dichiarato ha smesso di essere muto, o se il documento non e' piu' quello
      # che i dati producono.
      - name: Drift check - registro dei segni
        run: python3 tools/build_sign_registry.py --check

      # Le tre misure che vengono prima della matrice: segni orfani, obiettivi
      # che non si possono puntare col dito, Tensioni che non incontrano nessun
      # Destino. Il cancello era dichiarato in CLAUDE.md dalla 0.1.249 e **non
      # era in CI**: si e' visto facendo il giro a mano in 0.1.291.
      - name: Drift check - le tre misure della matrice
        run: python3 tools/matrix_survey.py --check

      # Ogni testo che un giocatore puo' leggere, in ordine di lettura. Senza
      # questo passo il documento e' rimasto fermo settanta versioni mentre lo
      # strumento che lo genera moriva all'avvio su un file cancellato (D-328).
      - name: Drift check - i testi in lettura
        run: python3 tools/build_review.py --check

      # Un blocco finito dopo un `return` non e' un errore per GDScript: e'
      # silenzio. Il bottone «Si comincia» della stanza e' vissuto una versione
      # intera dietro un return, e nessun test poteva vederlo (D-140).
      - name: Codice irraggiungibile nel GDScript
        run: python3 tools/dead_code.py

  godot:
    name: Test headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -sSLf -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q godot.zip
          mv "$name" godot
          chmod +x godot

      - name: Version
        run: ~/godot/godot --headless --version

      # Il codice d'uscita non basta. In GDScript un errore a runtime — una
      # chiave che non c'e', una proprieta' su un null — non alza niente che una
      # prova possa prendere: **interrompe la funzione**, scrive una riga di log
      # e lascia il resto delle asserzioni non eseguite. La suite conta i test
      # che ha fatto partire, non quelli che sono arrivati in fondo, e riporta
      # verde. Due prove erano morte cosi' da mesi, e sono tornate a misurare
      # cinquantasei asserzioni il giorno che qualcuno ha letto il log di una
      # esecuzione verde. Adesso lo legge il cancello.
      - name: Unit and smoke tests
        run: |
          set -o pipefail
          ~/godot/godot --headless --path godot --script res://tests/run_tests.gd \
            2>&1 | tee /tmp/tests.log
          if grep -q "SCRIPT ERROR" /tmp/tests.log; then
            echo "::error::una prova e' andata in errore a meta' e le asserzioni dopo non sono girate"
            grep -n "SCRIPT ERROR" -A4 /tmp/tests.log
            exit 1
          fi

      # Il catalogo dei Consigli (D-232). Le proposte, le clausole e le
      # Conseguenze vivono nel database: chi vuole leggerle deve aprire Godot.
      # Il catalogo e' quel materiale scritto in italiano, generato e committato
      # come il brief d'arte — e quindi puo' invecchiare in silenzio il giorno
      # che qualcuno cambia una proposta. Questo passo va rosso quel giorno.
      - name: Drift check - catalogo dei Consigli
        run: GODOT=~/godot/godot tools/run_council_catalogue.sh --check

      # Il catalogo delle carte (D-249). Una scheda per carta con i suoi numeri,
      # i suoi effetti e il prompt del disegno: e' il documento che si manda a
      # chi disegna e a chi stampa, ed e' generato da tre sorgenti diverse. Se
      # una di quelle cambia e il documento no, chi lo legge lavora su una carta
      # che non esiste piu'.
      - name: Drift check - catalogo delle carte
        run: GODOT=~/godot/godot tools/run_card_catalogue.sh --check

      # La misura delle vite (D-290). Quante delle vite scritte si siedono
      # davvero al tavolo in dodici saghe, sui due tavoli del cancello. E' il
      # numero su cui si giudica la soglia di trasformazione: se cambia senza
      # che nessuno l'abbia voluto, questo passo va rosso.
      # Il censimento dei componenti (D-295): quanti pezzi ha la scatola e
      # quanto ne vede l'app. Se qualcuno aggiunge una carta e il documento non
      # se ne accorge, questo passo va rosso.
      # Il catalogo delle pedine (D-297): una scheda per segnalino, col prompt.
      # Se qualcuno aggiunge una condizione e non dice cosa ci va disegnato
      # sopra, il segnalino non si puo' stampare: questo passo lo dice subito.
      - name: Drift check - il catalogo delle pedine
        run: python3 tools/token_catalogue.py --check

      - name: Drift check - i componenti
        run: python3 tools/components_survey.py --check

      - name: Drift check - la misura delle vite
        run: GODOT=~/godot/godot tools/run_lives_survey.sh --check

      - name: Drift check - la misura dei segni
        run: GODOT=~/godot/godot tools/run_marks_survey.sh --check

      - name: Drift check - la misura del tavolo
        run: GODOT=~/godot/godot tools/run_table_survey.sh --check

      - name: Ogni anno arriva in fondo, e lo stesso seme da' lo stesso salvataggio
        run: GODOT=~/godot/godot tools/run_sims.sh

      # Not a pass/fail gate on its own - test_balance.gd is - but the numbers
      # belong in the log so a rules change shows its effect on the record.
      - name: Balance probe
        run: |
          ~/godot/godot --headless --path godot \
            --script res://cli/run_balance_probe.gd -- --runs=40 --seed=1000

      # §18.3: same seed + same plan must produce a byte-identical save.
      - name: Determinism
        run: |
          set -euo pipefail
          OUT="$PWD/out-a" GODOT=~/godot/godot tools/run_sims.sh > /dev/null
          OUT="$PWD/out-b" GODOT=~/godot/godot tools/run_sims.sh > /dev/null
          for save in out-a/*.save.json; do
            name="$(basename "$save")"
            cmp "out-a/$name" "out-b/$name"
            echo "identico: $name"
          done

      # I fogli di stampa escono dagli stessi dati e devono uscire uguali: un SVG
      # e' testo, quindi qui un diff dice *quale carta* e' cambiata.
      - name: Export di stampa
        run: |
          set -euo pipefail
          OUT="$PWD/export-a" GODOT=~/godot/godot tools/run_export.sh
          OUT="$PWD/export-b" GODOT=~/godot/godot tools/run_export.sh > /dev/null
          diff -r export-a export-b
          echo "l'export e' deterministico"
          # Il brief committato e' quello generato: e' il documento che si manda
          # a chi disegna, e se invecchia manda prompt sbagliati.
          diff export-a/brief_arte.md docs/BRIEF_ARTE.md
          echo "docs/BRIEF_ARTE.md e' allineato"

      - name: Upload sim logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-output
          path: out/
          if-no-files-found: ignore

      # I fogli come artefatto: si scaricano, si aprono e si guardano senza
      # dover installare Godot.
      - name: Upload print sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-export
          path: export-a/
          if-no-files-found: ignore
