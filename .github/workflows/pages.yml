name: pages

# Build the Web export and publish it to GitHub Pages.
#
# The export is single-threaded on purpose (see godot/export_presets.cfg): the
# threaded Web build needs SharedArrayBuffer, which needs COOP/COEP response
# headers, which Pages cannot send. A turn-based game that waits on a click has
# nothing to gain from threads and everything to lose from not loading at all.

# Build su ogni pull request, pubblica solo da main. Cosi l'export viene
# verificato *prima* del merge: `workflow_dispatch` compare nella UI solo quando
# il file e gia sul branch di default, quindi senza questo l'unico modo di
# scoprire un export rotto sarebbe fonderlo su main e guardarlo fallire li.
#
# `push` e limitato a main di proposito: su un branch con una PR aperta i due
# eventi partono entrambi, e la seconda run viene cancellata dopo aver gia
# scaricato 1,3 GB di export template per niente.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# One deploy at a time; let a running one finish rather than publishing a
# half-built page.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build:
    name: Esporta per il web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica Godot e i template di export
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # A first pass populates the import cache. Exporting without it silently
      # leaves freshly added folders out of the pack, and the page then fails at
      # runtime with a script that cannot resolve - which is invisible to any
      # check that does not actually open the page.
      - name: Importa le risorse
        run: ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot --import

      - name: Esporta
        run: |
          mkdir -p build/web
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path godot \
            --export-release "Web" ../build/web/index.html
          test -f build/web/index.wasm

      # `enablement: true` mette Pages in modalita "GitHub Actions" via API invece
      # di dipendere da un interruttore nelle impostazioni. Senza, il primo
      # deploy fallisce in due secondi senza log e senza runner - il job non
      # parte proprio - perche il build type e ancora "Deploy from a branch",
      # e non c'e niente nell'output che lo dica.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

      # Sugli altri branch resta comunque scaricabile, per poterlo aprire in
      # locale e vedere cosa fara la pagina dopo il merge.
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: web-build
          path: build/web
          retention-days: 7

  deploy:
    name: Pubblica
    needs: build
    # Solo da main: gli altri branch verificano che l'export funzioni e basta.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
